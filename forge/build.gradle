plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.7.9-forge'
group = 'com.metronav'
base {
    archivesName = 'metronav-forge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                metronav {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    // MTR（Forge 4.0.5+1.20.1）只当编译依赖：运行时由玩家自己装的 MTR 提供
    compileOnly fileTree(dir: '../libs', include: ['MTR-forge-*.jar'])
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'metronav',
                'Specification-Vendor'    : 'metronav',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'metronav'
        ])
    }
    finalizedBy 'reobfJar'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}
